name: Validate exact semantic-memory candidate
on:
  push:
    branches:
      - work/semantic-memory-validation-20260912
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain integration inputs
        run: |
          tar -cf "$RUNNER_TEMP/integration-inputs.tar" .integration
          cp .integration/integrate.py "$RUNNER_TEMP/integrate.py"
      - uses: actions/upload-artifact@v4
        with:
          name: integration-inputs
          path: ${{ runner.temp }}/integration-inputs.tar
          retention-days: 1
      - name: Validate and publish immutable tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/integrate.py"
