name: Validate method and distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source and run tests
        run: make validate
      - name: Build local distribution
        run: make package
      - name: Archive tested source
        if: always()
        run: git archive --format=tar --output=source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-source
          path: source.tar
          retention-days: 1
