name: npm distribution
on:
  push:
    branches: [work/npm-distribution-20260913]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 2
      - name: Inspect registry access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_AUTH=not_configured"
          else
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm whoami --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000
            rm -f "$RUNNER_TEMP/npmrc"
          fi
          npm view knowledge-work-sdlc name version --json --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000 || true
