name: Validate continuity and replay candidate
on:
  push:
    branches: [work/continuity-replay-20260914]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare exact candidate
        run: |
          cp .build/continuity_candidate.py "$RUNNER_TEMP/continuity_candidate.py"
          git reset --hard be2fdb4a02f97d29361e4d5036fefaea551a69d9
          git clean -fdx
          python3 "$RUNNER_TEMP/continuity_candidate.py"
          git diff --check
          git add .
          test "$(git write-tree)" = c3df1e502dcfeab9da76406961786ca0f0a4063d
          git -c user.name='Knowledge Work build' -c user.email=build@localhost commit -m 'Validate continuity and replay candidate'
      - name: Validate core
        run: make validate
      - name: Exercise packed installer
        run: npm test
      - name: Build distributions
        run: |
          make package
          npm pack --pack-destination dist --json > dist/npm-pack.json
          npm publish --dry-run ./dist/knowledge-work-sdlc-0.7.1.tgz
          git diff --exit-code
          git archive --format=tar HEAD > dist/source.tar
      - name: Store tested immutable product tree
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          base='70ab7879915058f505b086f551dc56fe98635814'
          expected='c3df1e502dcfeab9da76406961786ca0f0a4063d'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert paths and not any(p.startswith('.build/') or p.startswith('ai_docs/') for p in paths)
          entries=[]
          for p in paths:
              mode=subprocess.check_output(['git','ls-files','-s','--',p],text=True).split()[0]
              assert mode in ('100644','100755')
              entries.append({'path':p,'mode':mode,'type':'blob','content':Path(p).read_text()})
          payload={'base_tree':'d2601f4d6a3ba16cf6799a1008833388cd2e1815','tree':entries}
          req=urllib.request.Request('https://api.github.com/repos/TJ4519/knowledge-work-sdlc/git/trees',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: result=json.load(r)
          assert result['sha']==expected,result['sha']
          Path('dist/tested-tree.json').write_text(json.dumps({'base_commit':base,'tested_tree':expected,'changed_paths':paths,'run_id':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
          print('TESTED_PRODUCT_TREE='+result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-replay-${{ matrix.os }}
          path: dist/
          retention-days: 7
