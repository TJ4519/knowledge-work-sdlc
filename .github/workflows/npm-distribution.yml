name: Validate npm candidate
on:
  push:
    branches: [work/npm-distribution-20260913]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve transfer and scripts
        run: |
          cp .npm-build/changes.patch.gz "$RUNNER_TEMP/changes.patch.gz"
          cp .npm-build/prepare.py "$RUNNER_TEMP/prepare.py"
          cp .npm-build/publish-tree.py "$RUNNER_TEMP/publish-tree.py"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-transfer
          path: ${{ runner.temp }}/changes.patch.gz
          retention-days: 2
      - name: Prepare exact candidate
        run: python3 "$RUNNER_TEMP/prepare.py"
      - name: Validate source and exercise packed installer
        run: |
          make validate
          npm test
          make package
          npm pack --pack-destination dist --json > dist/npm-pack.json
          npm publish --dry-run ./dist/knowledge-work-sdlc-0.7.0.tgz
          git diff --exit-code
      - name: Upload tested immutable tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/publish-tree.py"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-npm-package
          path: dist/
          retention-days: 7
