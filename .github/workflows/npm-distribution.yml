name: npm distribution
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=tar HEAD > "${{ runner.temp }}/source.tar"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: source-checkout
          path: ${{ runner.temp }}/source.tar
          retention-days: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate core
        run: make validate
      - name: Exercise packed npm installer
        run: npm test
      - name: Build plugin and npm archives
        run: |
          make package
          npm pack --pack-destination dist --json > dist/npm-pack.json
          version=$(node -p 'require("./package.json").version')
          npm publish --dry-run "./dist/knowledge-work-sdlc-${version}.tgz"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.os }}
          path: dist/
          retention-days: 7
